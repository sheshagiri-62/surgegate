# Install once:   make init        (runs `pre-commit install`)
# Run manually:   make lint        (runs every hook on every file)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deploy/helm/.*/templates/ # Helm templates are not plain YAML
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key # safety rule 2: never commit secrets
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
