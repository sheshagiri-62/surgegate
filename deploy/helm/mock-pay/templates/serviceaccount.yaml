# EKS Pod Identity maps this service account to the surgegate-<env>-mock-pay IAM role
# (infra/envs/<env>/mock_pay.tf): read the payment secret, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "mock-pay.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
