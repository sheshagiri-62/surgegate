apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "organiser.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "organiser.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "organiser.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false # no Kubernetes or AWS access needed
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: organiser
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BOOKING_API_URL
              value: {{ .Values.bookingApiUrl | quote }}
            - name: COGNITO_REGION
              value: {{ .Values.cognito.region | quote }}
            - name: COGNITO_CLIENT_ID
              value: {{ .Values.cognito.clientId | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /organiser/api/healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /organiser/api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 64Mi
