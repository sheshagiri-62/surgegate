# booking-api chart values (dev).
# image.tag is changed ONLY by .github/workflows/build-deploy.yml (git SHA of the build).
image:
  repository: 968077439619.dkr.ecr.ap-south-1.amazonaws.com/surgegate/booking-api
  tag: "b1994433d601" # set by build-deploy
  pullPolicy: IfNotPresent

replicaCount: 2 # used only when autoscaling is off

# HPA on CPU (Day 10 Task 1); needs metrics-server (EKS add-on, infra/modules/eks).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4 # dev: 2 t3.medium nodes (demo: more, Karpenter adds nodes)
  targetCPU: 60

# Pre-scaling 15 minutes before a sale (CronJob, app/prescale.py).
prescale:
  enabled: true
  minReplicas: 3 # dev; demo sets more
  leadMinutes: 15
  holdMinutes: 60

containerPort: 8000

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  path: /healthz

# CloudFront → ALB (Terraform) → this target group → pods. See ADR 003.
targetGroupBinding:
  enabled: true
  targetGroupName: surgegate-dev-booking-api

serviceAccount:
  name: booking-api # must match infra/envs/dev/booking_api.tf (Pod Identity association)

aws:
  region: ap-south-1

# app/db.py looks up the endpoint and the RDS-managed secret of this instance at start-up.
database:
  instanceId: surgegate-dev-pg

# alembic upgrade head as an Argo CD Sync hook Job (wave -5) before the pods roll out.
migrations:
  enabled: true

# Cognito (terraform output cognito_user_pool_id / cognito_client_ids). Not secret: these IDs are
# public by design (the browser uses them to sign in).
auth:
  userPoolId: ap-south-1_phaiS0DT0
  clientIds:
    - aaaemg3vc5gjrerk026jh5r9e # buyer-web
    - 4r1b379rs37m8mq284e35esfha # organiser-web
    - 7jf95pjsnjqg043d0ing7rngv5 # test (dev scripts)

# ElastiCache Redis (seat-map cache). The primary endpoint name is stable across make down/up.
redis:
  host: master.surgegate-dev-redis.cr9kvu.aps1.cache.amazonaws.com
  authSecretId: surgegate/dev/data/redis-auth

# Browser origins allowed to call the API. The CloudFront site is same-origin (no CORS needed);
# localhost:3000 is the buyer app on the laptop with the API via port-forward.
cors:
  allowOrigins:
    - http://localhost:3000
    - https://d1t9vww2xtyvsz.cloudfront.net

# Waiting-room state (organiser controls write the queue's META item).
queue:
  table: surgegate-dev-queue

# Every /book/{event}/... request needs the waiting room's booking pass (X-Booking-Pass).
bookingPass:
  required: true
  secretId: surgegate/dev/queue/pass-key

# Sale events (ADR 002): seat_held etc. go to this Kinesis stream (best-effort).
saleEvents:
  stream: surgegate-dev-sale-events

# 10-minute hold timer (Step Functions); one execution per hold.
holdTimer:
  arn: arn:aws:states:ap-south-1:968077439619:stateMachine:surgegate-dev-hold-timer

# Payments (ADR 004): the Razorpay-shaped mock for now; PAYMENT_PROVIDER=razorpay later.
payments:
  provider: mock
  secretId: surgegate/dev/data/razorpay # key_id, key_secret, webhook_secret (Terraform-generated)
  mock:
    apiUrl: http://mock-pay.mock-pay.svc.cluster.local # /v1/orders, cluster only
    checkoutBase: https://d1t9vww2xtyvsz.cloudfront.net # /mockpay/checkout/* via CloudFront
  # Where the checkout may send buyers back: the buyer site on CloudFront, and the laptop.
  returnOrigins:
    - https://d1t9vww2xtyvsz.cloudfront.net
    - http://localhost:3000
  # Webhook endpoint -> this SQS queue -> order worker (Day 7 Task 4).
  queueUrl: https://sqs.ap-south-1.amazonaws.com/968077439619/surgegate-dev-payments

# Order worker: same image, `python -m app.order_worker`, long-polls the payments queue and
# confirms payments exactly once. Own service account and IAM role (infra/envs/dev/order_worker.tf).
orderWorker:
  enabled: true
  replicaCount: 1
  serviceAccount: order-worker
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

# "My tickets": presigned 5-minute links to the ticket PDFs (Day 8 Task 1).
tickets:
  bucket: surgegate-dev-tickets-968077439619
  keySecretId: surgegate/dev/data/ticket-key # gate check-in verifies the QR tokens

# Organiser live dashboard (Day 8 Task 3): the booking API signs 60-second WebSocket tokens.
live:
  keySecretId: surgegate/dev/events/live-key
  wsUrl: wss://co9vraz26k.execute-api.ap-south-1.amazonaws.com/live # terraform output live_ws_url

# Observability (Day 9 Task 3): JSON logs always; traces when the CloudWatch agent add-on runs
# (infra: enable_container_insights). 10% of requests sampled: inside X-Ray's free 100k/month.
environment: dev
tracing:
  enabled: true
  otlpEndpoint: http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4318
  sampleRatio: "0.1"

# Canary releases with Argo Rollouts (Day 10 Task 2). Analysis reads the booking-api target
# group's CloudWatch metrics (terraform output: alb / target group ARN suffixes).
rollout:
  enabled: true
  steps: [25, 50] # then 100%
  analysis:
    initialDelay: 3m # ALB metrics arrive ~3 min late
    window: 5m # each measurement reads the last 5 one-minute datapoints
    interval: 1m
    count: 3
    max5xxPct: 2
    maxP95Seconds: 0.5
    loadBalancer: app/surgegate-dev-api/f466ab745985ef97
    targetGroup: targetgroup/surgegate-dev-booking-api/22d6cb6325c2fb1c

# Broken-release test ONLY: a fraction of requests answer 500 (/healthz stays green).
faultInjection:
  errorRate: "0.5" # BROKEN-RELEASE TEST (Day 10 Task 2): must be aborted by the canary analysis
