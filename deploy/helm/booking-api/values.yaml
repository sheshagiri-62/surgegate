# booking-api chart values (dev).
# image.tag is changed ONLY by .github/workflows/build-deploy.yml (git SHA of the build).
image:
  repository: 968077439619.dkr.ecr.ap-south-1.amazonaws.com/surgegate/booking-api
  tag: "5ea3465eb470" # set by build-deploy
  pullPolicy: IfNotPresent

replicaCount: 2

containerPort: 8000

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  path: /healthz

# CloudFront → ALB (Terraform) → this target group → pods. See ADR 003.
targetGroupBinding:
  enabled: true
  targetGroupName: surgegate-dev-booking-api

serviceAccount:
  name: booking-api # must match infra/envs/dev/booking_api.tf (Pod Identity association)

aws:
  region: ap-south-1

# app/db.py looks up the endpoint and the RDS-managed secret of this instance at start-up.
database:
  instanceId: surgegate-dev-pg

# alembic upgrade head as an Argo CD Sync hook Job (wave -5) before the pods roll out.
migrations:
  enabled: true

# Cognito (terraform output cognito_user_pool_id / cognito_client_ids). Not secret: these IDs are
# public by design (the browser uses them to sign in).
auth:
  userPoolId: ap-south-1_phaiS0DT0
  clientIds:
    - aaaemg3vc5gjrerk026jh5r9e # buyer-web
    - 4r1b379rs37m8mq284e35esfha # organiser-web
    - 7jf95pjsnjqg043d0ing7rngv5 # test (dev scripts)

# ElastiCache Redis (seat-map cache). The primary endpoint name is stable across make down/up.
redis:
  host: master.surgegate-dev-redis.cr9kvu.aps1.cache.amazonaws.com
  authSecretId: surgegate/dev/data/redis-auth

# Browser origins allowed to call the API (dev: buyer app on the laptop, API via port-forward).
cors:
  allowOrigins:
    - http://localhost:3000

# Waiting-room state (organiser controls write the queue's META item).
queue:
  table: surgegate-dev-queue

# Every /book/{event}/... request needs the waiting room's booking pass (X-Booking-Pass).
bookingPass:
  required: true
  secretId: surgegate/dev/queue/pass-key

# Sale events (ADR 002): seat_held etc. go to this Kinesis stream (best-effort).
saleEvents:
  stream: surgegate-dev-sale-events

# 10-minute hold timer (Step Functions); one execution per hold.
holdTimer:
  arn: arn:aws:states:ap-south-1:968077439619:stateMachine:surgegate-dev-hold-timer

# Payments (ADR 004): the Razorpay-shaped mock for now; PAYMENT_PROVIDER=razorpay later.
payments:
  provider: mock
  secretId: surgegate/dev/data/razorpay # key_id, key_secret, webhook_secret (Terraform-generated)
  mock:
    apiUrl: http://mock-pay.mock-pay.svc.cluster.local # /v1/orders, cluster only
    checkoutBase: https://d1t9vww2xtyvsz.cloudfront.net # /mockpay/checkout/* via CloudFront
  # Where the checkout may send buyers back. Add the buyer CloudFront origin when the buyer
  # site is deployed there.
  returnOrigins:
    - http://localhost:3000
