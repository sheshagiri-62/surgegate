# EKS Pod Identity maps this service account to the surgegate-<env>-booking-api IAM role
# (infra/envs/<env>/booking_api.tf). No annotation is needed, unlike IRSA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "booking-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10" # exists before the migration Job (wave -5)
