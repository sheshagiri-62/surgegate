{{- if .Values.migrations.enabled }}
# Database migrations run BEFORE the new pods start. Argo CD applies sync waves in order and
# waits for each: ServiceAccount (wave -10) -> this Job (wave -5, must succeed) -> Deployment
# (wave 0). If the migration fails the sync stops, so a broken schema never reaches users.
# (Not PreSync: that phase runs before the ServiceAccount exists on the very first sync.)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "booking-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation # keep the last run's logs
spec:
  backoffLimit: 6 # covers RDS still starting right after make up
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "booking-api.dbEnv" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
