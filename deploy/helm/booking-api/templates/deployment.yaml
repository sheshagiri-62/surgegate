apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "booking-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # With the HPA on, it owns the replica count (no replicas here, so Argo CD doesn't fight it).
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "booking-api.selector" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "booking-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false # Pod Identity adds its own token; no Kubernetes API access
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "booking-api.selector" . | nindent 14 }}
      # Graceful shutdown (found by the Day 10 canary test: 11-31 ALB 502/504 at every scale-down):
      # preStop keeps serving while the ALB deregisters the pod, then uvicorn drains in-flight
      # requests (--timeout-graceful-shutdown) before the grace period ends.
      terminationGracePeriodSeconds: 45
      containers:
        - name: booking-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "booking-api.dbEnv" . | nindent 12 }}
            {{- include "booking-api.authEnv" . | nindent 12 }}
            {{- include "booking-api.redisEnv" . | nindent 12 }}
            {{- include "booking-api.corsEnv" . | nindent 12 }}
            {{- include "booking-api.paymentsEnv" . | nindent 12 }}
            {{- include "booking-api.otelEnv" (dict "ctx" . "svc" "booking-api") | nindent 12 }}
            {{- if ne (toString .Values.faultInjection.errorRate) "0" }}
            - name: FAULT_ERROR_RATE # broken-release test ONLY (Day 10 Task 2)
              value: {{ .Values.faultInjection.errorRate | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.shutdown.preStopSeconds }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
