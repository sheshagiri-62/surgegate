# build-deploy-buyer: on every push to main that changes web/buyer:
#   lint/typecheck/test -> static export (same-origin API through CloudFront) -> S3 (OIDC,
#   site-deploy role) -> CloudFront invalidation. Hashed /_next/static files are cached for a
#   year; pages for 60 s, so a deploy is visible within a minute even without the invalidation.
name: build-deploy-buyer

on:
  push:
    branches: [main]
    paths:
      - "web/buyer/**"
      - ".github/workflows/build-deploy-buyer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy-buyer
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  SERVICE_DIR: web/buyer
  SITE_BUCKET: surgegate-dev-buyer-site-968077439619
  DISTRIBUTION_ID: E8H8TXUDV1OG7

jobs:
  deploy:
    name: Build and deploy the buyer site (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC -> surgegate-gha-site-deploy
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Same origin as the API: /book/*, /orders/*, /me/* go to the ALB and /queue/* to API
      # Gateway through the same CloudFront distribution, so the bases are empty (relative URLs).
      # None of these are secrets (the browser needs them to sign in).
      - name: Static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""
          NEXT_PUBLIC_QUEUE_API: ""
          NEXT_PUBLIC_COGNITO_REGION: ap-south-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: aaaemg3vc5gjrerk026jh5r9e # buyer-web app client (public)

      - name: Configure AWS credentials (OIDC, site-deploy role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
          role-session-name: build-deploy-buyer-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets first (immutable), then the pages, then delete what the new build dropped.
      - name: Upload to S3
        run: |
          aws s3 sync out/_next/static "s3://${SITE_BUCKET}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync out "s3://${SITE_BUCKET}" --exclude "_next/static/*" \
            --cache-control "public, max-age=60"
          aws s3 sync out "s3://${SITE_BUCKET}" --delete --size-only

      - name: Invalidate CloudFront (pages)
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${DISTRIBUTION_ID}" --id "$id"
          echo "invalidation $id completed"

      - name: Smoke test through CloudFront
        run: |
          curl -fsS -o /dev/null -w "home %{http_code}\n" https://d1t9vww2xtyvsz.cloudfront.net/
          curl -fsS -o /dev/null -w "waiting %{http_code}\n" "https://d1t9vww2xtyvsz.cloudfront.net/waiting/?id=x"
