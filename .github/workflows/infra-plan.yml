# On every pull request that touches Terraform: fmt, validate, tflint and plan for each root,
# then post the plan as a PR comment. Uses the read-only surgegate-gha-plan role through OIDC.
#
# Runs on EVERY pull request (no paths filter) so the final "infra-plan" job always reports;
# it is a required status check on main. PRs that don't touch Terraform skip fmt/plan and pass.
name: infra-plan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.65.0"
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  detect:
    name: Find Terraform roots
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to diff against the PR base

      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          if echo "$files" | grep -Eq '^(infra/|\.tflint\.hcl$|\.github/workflows/infra-plan\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "Terraform-related files changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No Terraform-related changes; skipping fmt and plan."
          fi

      # A root is infra/bootstrap or infra/envs/<env>, if it holds .tf files. Modules are
      # checked through the roots that call them.
      - id: roots
        run: |
          roots=$(for d in infra/bootstrap infra/envs/*/; do
            d=${d%/}; ls "$d"/*.tf >/dev/null 2>&1 && echo "$d"
          done | jq -R . | jq -cs .)
          echo "roots=$roots" >> "$GITHUB_OUTPUT"
          echo "Terraform roots: $roots"

  fmt:
    name: terraform fmt
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra

  plan:
    name: plan (${{ matrix.root }})
    needs: [detect, fmt]
    if: needs.detect.outputs.changed == 'true' && needs.detect.outputs.roots != '[]'
    # Fork PRs get no OIDC token, and must never reach AWS.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.detect.outputs.roots) }}
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
      pull-requests: write # plan comment
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Skip fork pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        working-directory: .
        run: |
          echo "::error::infra-plan does not run for pull requests from forks."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: infra-plan-pr${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: terraform init
        run: terraform init -lockfile=readonly

      - name: terraform validate
        run: terraform validate -no-color

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits when fetching plugins
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=2m -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 1 ]; then terraform show -no-color tfplan > plan.txt; else cp plan.log plan.txt; fi

      - name: Post plan as PR comment
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROOT: ${{ matrix.root }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const code = process.env.EXITCODE;
            const marker = `<!-- infra-plan:${root} -->`;
            const status = { '0': '✅ No changes', '2': '📝 Changes', '1': '❌ Plan failed' }[code] ?? `exit ${code}`;
            let plan = fs.readFileSync(`${root}/plan.txt`, 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || [''])[0];
            const limit = 60000; // GitHub comments are capped at 65,536 characters
            if (plan.length > limit) plan = plan.slice(0, limit) + '\n... (truncated, see the job log)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan — \`${root}\` — ${status}`,
              summary ? `**${summary}**` : '',
              `<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`,
              `_Commit ${context.payload.pull_request.head.sha.slice(0, 7)} · [workflow run](${run})_`,
            ].join('\n\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # The single required status check on main. Always runs; "skipped" jobs count as success.
  infra-plan:
    name: infra-plan
    needs: [detect, fmt, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job ended with '$r'."; exit 1;; esac
          done
