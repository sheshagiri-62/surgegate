# build-deploy: on every push to main that changes the booking API:
#   test → build → Trivy scan (fail on CRITICAL) → push to ECR (OIDC) → ECR scan result →
#   commit the new image tag to deploy/helm/booking-api/values.yaml (deploy key) → Argo CD deploys.
# The tag-bump commit only touches values.yaml, which is not in the paths below, so it does not
# re-trigger this workflow.
name: build-deploy

on:
  push:
    branches: [main]
    paths:
      - "services/booking-api/**"
      - ".github/workflows/build-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy-booking-api
  cancel-in-progress: false # never cancel half-way through a push + tag bump

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: surgegate/booking-api
  SERVICE_DIR: services/booking-api
  VALUES_FILE: deploy/helm/booking-api/values.yaml

jobs:
  test:
    name: Test (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  build-push:
    name: Build, scan, push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → surgegate-gha-ecr-push
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC, ECR push role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: build-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # Tags are IMMUTABLE: if this commit's image is already in ECR (a re-run), skip build/push.
      - id: exists
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "Image $TAG already in ECR; skipping build and push."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load locally, not pushed yet)
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.SERVICE_DIR }}
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (fail on CRITICAL)
        if: steps.exists.outputs.found != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push to ECR
        if: steps.exists.outputs.found != 'true'
        run: docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.meta.outputs.tag }}"

      # Basic scan-on-push creates the scan record a few seconds after the push, and
      # `aws ecr wait image-scan-complete` fails at once on ScanNotFoundException, so poll instead.
      - name: ECR scan-on-push result
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for i in $(seq 1 36); do
            status=$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="$TAG" --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)
            echo "attempt $i: scan status $status"
            [ "$status" = "COMPLETE" ] && break
            [ "$status" = "FAILED" ] && { echo "::warning::ECR scan failed"; exit 0; }
            sleep 5
          done
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts' --output table

  bump-tag:
    name: Bump Helm image tag (deploy key)
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      # The deploy key is the only actor allowed to bypass the main ruleset, and this job only
      # ever changes image.tag in one values file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Commit and push the new tag
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${TAG}\" # set by build-deploy/" "$VALUES_FILE"
          git diff --stat
          git diff --quiet && { echo "Tag already ${TAG}; nothing to commit."; exit 0; }
          git config user.name  "surgegate-build-deploy"
          git config user.email "build-deploy@users.noreply.github.com"
          git commit -am "ci: deploy booking-api ${TAG}"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
