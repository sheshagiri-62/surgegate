# ci: tests on every pull request that touches the booking API.
#   ruff (lint + format) → pytest: unit tests AND integration tests against a real PostgreSQL 18
#   (service container), including migrations, the hold UPDATE under concurrency and tenant
#   isolation. No AWS access is needed or granted.
name: ci

on:
  pull_request:
    paths:
      - "services/booking-api/**"
      - "web/buyer/**"
      - "services/queue/**"
      - "services/workers/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  booking-api:
    name: booking-api (ruff + pytest + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/booking-api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: surgegate
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: surgegate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surgegate"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis: # seat-map cache tests
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://surgegate:ci-only-not-a-secret@localhost:5432/surgegate_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/booking-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q -ra

  buyer-web:
    name: buyer web (lint + typecheck + jest + static build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/buyer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/buyer/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ci-placeholder

  queue:
    name: queue Lambdas (ruff + pytest with moto)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/queue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/queue/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q -ra

  workers:
    name: workers (ruff + pytest on the real schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: surgegate
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: surgegate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surgegate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://surgegate:ci-only-not-a-secret@localhost:5432/surgegate_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/workers/requirements-dev.txt
            services/booking-api/requirements.txt
      # The schema comes from the booking API's own migrations.
      - run: pip install -r services/booking-api/requirements.txt -r services/workers/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: services/booking-api
      - run: ruff check . && ruff format --check .
        working-directory: services/workers
      - run: pytest -q -ra
        working-directory: services/workers
